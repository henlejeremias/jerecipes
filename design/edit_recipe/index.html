<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#ffc7c4",
              "on-secondary-container": "#65473e",
              "surface-container": "#ffe1e0",
              "on-tertiary": "#ffedfe",
              "on-surface": "#4e2120",
              "secondary-container": "#fed3c7",
              "background": "#fff4f3",
              "secondary-dim": "#67483f",
              "surface-container-high": "#ffdad8",
              "primary-dim": "#982400",
              "tertiary-container": "#e699fd",
              "on-primary-fixed-variant": "#591100",
              "tertiary-fixed-dim": "#d78cee",
              "primary": "#ad2a00",
              "on-error-container": "#570008",
              "secondary-fixed-dim": "#efc6b9",
              "primary-fixed-dim": "#fb6036",
              "on-tertiary-fixed-variant": "#611b79",
              "inverse-primary": "#fb6036",
              "outline-variant": "#e09c99",
              "on-secondary-fixed": "#51352c",
              "on-secondary-fixed-variant": "#705147",
              "outline": "#a26765",
              "surface-variant": "#ffd2d0",
              "on-background": "#4e2120",
              "on-primary": "#ffefec",
              "surface-bright": "#fff4f3",
              "surface-container-low": "#ffedeb",
              "primary-fixed": "#ff7853",
              "inverse-on-surface": "#ce8c89",
              "surface": "#fff4f3",
              "on-error": "#ffefee",
              "error-container": "#fb5151",
              "surface-container-lowest": "#ffffff",
              "error": "#b31b25",
              "tertiary": "#833e9a",
              "inverse-surface": "#240304",
              "surface-tint": "#ad2a00",
              "secondary-fixed": "#fed3c7",
              "on-primary-container": "#480c00",
              "tertiary-dim": "#75318d",
              "error-dim": "#9f0519",
              "on-tertiary-fixed": "#360049",
              "on-secondary": "#ffefeb",
              "primary-container": "#ff7853",
              "secondary": "#74544a",
              "surface-container-highest": "#ffd2d0",
              "on-surface-variant": "#834c4b",
              "tertiary-fixed": "#e699fd",
              "on-tertiary-container": "#570e70",
              "on-primary-fixed": "#000000"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Be Vietnam Pro"],
              "label": ["Be Vietnam Pro"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-effect {
            background: rgba(255, 244, 243, 0.7);
            backdrop-filter: blur(20px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-[#fff4f3] dark:bg-stone-950 flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#ffedeb] transition-colors">
<span class="material-symbols-outlined text-[#ad2a00]">close</span>
</button>
<span class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-xl text-[#ad2a00]">Edit Recipe</span>
</div>
<div class="flex items-center gap-2">
<button class="px-6 py-2.5 bg-primary text-on-primary rounded-full font-bold text-sm tracking-wide shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all">
                Save Changes
            </button>
</div>
</header>
<main class="max-w-4xl mx-auto px-6 py-8 pb-32">
<div class="flex flex-col gap-10">
<!-- Hero Image & Title Section -->
<section class="relative group">
<div class="w-full h-80 rounded-xl overflow-hidden relative">
<img alt="Spicy Thai Red Curry" class="w-full h-full object-cover" data-alt="Rich red curry with fresh herbs and chili" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfv8TS3JnvnNOyrmTKoxd6Z0e8ExIxw1QXp4lrejuC7I0w4u3n9KoMhSFs4Rw57V83pU2EfIuWZ3HxL1zHSRyhmPFUrfDIsc7klCCzGNF8-ZdXfikLUibxQ4P16yow14o6VO9PrZFPKJsNJjndjpVHtQ_RdfaSpyUtG1fNoLynchqeX3arvf6j9EM3kT2KWyF3pgaUDk7j2A1qOdBvIYnEG73GKGKKvSpcd39UI_e430YUiFOIlUieZZgwRIIK9A3WV1kKce9K4v0"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
<button class="absolute bottom-6 right-6 p-4 bg-surface-container-highest rounded-full shadow-xl text-primary hover:scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
</section>
<!-- Basic Info Form -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-8">
<div class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-4">Recipe Title</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-6 py-4 text-xl font-bold font-headline focus:ring-2 focus:ring-primary text-on-surface" placeholder="e.g. Grandma's Pasta" type="text" value="Spicy Thai Red Curry"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-4">Source / Author</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-6 py-4 font-semibold focus:ring-2 focus:ring-primary text-on-surface" placeholder="Website or Chef name" type="text" value="Authentic Kitchen Boutique"/>
</div>
</div>
<!-- Metrics Bento -->
<div class="bg-surface-container-low p-6 rounded-xl grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Prep Time</label>
<div class="flex items-center gap-2">
<input class="w-12 bg-transparent border-b border-outline-variant p-0 font-bold text-lg focus:ring-0" type="text" value="20"/>
<span class="text-sm font-medium opacity-60">min</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Wait Time</label>
<div class="flex items-center gap-2">
<input class="w-12 bg-transparent border-b border-outline-variant p-0 font-bold text-lg focus:ring-0" type="text" value="15"/>
<span class="text-sm font-medium opacity-60">min</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Calories</label>
<div class="flex items-center gap-2">
<input class="w-12 bg-transparent border-b border-outline-variant p-0 font-bold text-lg focus:ring-0" type="text" value="450"/>
<span class="text-sm font-medium opacity-60">kcal</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Protein</label>
<div class="flex items-center gap-2">
<input class="w-12 bg-transparent border-b border-outline-variant p-0 font-bold text-lg focus:ring-0" type="text" value="32"/>
<span class="text-sm font-medium opacity-60">g</span>
</div>
</div>
<div class="col-span-2 pt-2 border-t border-outline-variant/30 flex justify-between items-center">
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Carbs: 18g</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Fats: 22g</span>
</div>
</div>
</section>
<!-- Ingredients Editor (Pill inside a Pill style) -->
<section class="flex flex-col gap-4">
<div class="flex items-center justify-between px-2">
<h2 class="text-2xl font-black font-headline tracking-tight text-primary">Ingredients</h2>
<button class="flex items-center gap-1 text-sm font-bold text-primary px-4 py-2 rounded-full hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-lg">add_circle</span>
                        Add Ingredient
                    </button>
</div>
<div class="space-y-3">
<!-- Ingredient Row -->
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-full border border-surface-variant/30">
<div class="flex items-center gap-2 pl-2">
<span class="material-symbols-outlined text-outline cursor-grab text-lg">drag_indicator</span>
<div class="bg-surface-container-highest rounded-full px-4 py-2">
<input class="w-16 bg-transparent border-none p-0 text-sm font-black text-center focus:ring-0" type="text" value="400ml"/>
</div>
</div>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-medium px-0" type="text" value="Coconut Milk (Full Fat)"/>
<button class="pr-3 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Ingredient Row -->
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-full border border-surface-variant/30">
<div class="flex items-center gap-2 pl-2">
<span class="material-symbols-outlined text-outline cursor-grab text-lg">drag_indicator</span>
<div class="bg-surface-container-highest rounded-full px-4 py-2">
<input class="w-16 bg-transparent border-none p-0 text-sm font-black text-center focus:ring-0" type="text" value="3 tbsp"/>
</div>
</div>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-medium px-0" type="text" value="Red Curry Paste"/>
<button class="pr-3 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Ingredient Row -->
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-full border border-surface-variant/30">
<div class="flex items-center gap-2 pl-2">
<span class="material-symbols-outlined text-outline cursor-grab text-lg">drag_indicator</span>
<div class="bg-surface-container-highest rounded-full px-4 py-2">
<input class="w-16 bg-transparent border-none p-0 text-sm font-black text-center focus:ring-0" type="text" value="500g"/>
</div>
</div>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-medium px-0" type="text" value="Chicken Breast, sliced thin"/>
<button class="pr-3 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Ingredient Row -->
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-full border border-surface-variant/30">
<div class="flex items-center gap-2 pl-2">
<span class="material-symbols-outlined text-outline cursor-grab text-lg">drag_indicator</span>
<div class="bg-surface-container-highest rounded-full px-4 py-2">
<input class="w-16 bg-transparent border-none p-0 text-sm font-black text-center focus:ring-0" type="text" value="1/2 cup"/>
</div>
</div>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-medium px-0" type="text" value="Thai Basil Leaves"/>
<button class="pr-3 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</section>
<!-- Instructions Editor -->
<section class="flex flex-col gap-4">
<div class="flex items-center justify-between px-2">
<h2 class="text-2xl font-black font-headline tracking-tight text-primary">Instructions</h2>
<button class="flex items-center gap-1 text-sm font-bold text-primary px-4 py-2 rounded-full hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-lg">playlist_add</span>
                        Add Step
                    </button>
</div>
<div class="space-y-6">
<!-- Step 1 -->
<div class="relative pl-12 group">
<div class="absolute left-0 top-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold font-headline shadow-md">1</div>
<div class="bg-surface-container-low rounded-xl p-5 group-hover:bg-surface-container transition-colors">
<textarea class="w-full bg-transparent border-none focus:ring-0 p-0 text-base leading-relaxed" placeholder="Describe the first step..." rows="3">Heat a large skillet or wok over medium-high heat. Add a splash of oil and the red curry paste. Fry for 1-2 minutes until fragrant and the oil begins to separate.</textarea>
<div class="flex justify-end mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="p-2 text-on-surface-variant hover:text-error"><span class="material-symbols-outlined text-lg">delete</span></button>
</div>
</div>
</div>
<!-- Step 2 -->
<div class="relative pl-12 group">
<div class="absolute left-0 top-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold font-headline shadow-md">2</div>
<div class="bg-surface-container-low rounded-xl p-5 group-hover:bg-surface-container transition-colors">
<textarea class="w-full bg-transparent border-none focus:ring-0 p-0 text-base leading-relaxed" placeholder="Describe the next step..." rows="3">Pour in the coconut milk and bring to a gentle simmer. Add the sliced chicken and stir to coat. Cook for 5-7 minutes until chicken is cooked through.</textarea>
<div class="flex justify-end mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="p-2 text-on-surface-variant hover:text-error"><span class="material-symbols-outlined text-lg">delete</span></button>
</div>
</div>
</div>
<!-- Step 3 -->
<div class="relative pl-12 group">
<div class="absolute left-0 top-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold font-headline shadow-md">3</div>
<div class="bg-surface-container-low rounded-xl p-5 group-hover:bg-surface-container transition-colors">
<textarea class="w-full bg-transparent border-none focus:ring-0 p-0 text-base leading-relaxed" placeholder="Describe the next step..." rows="3">Tear the basil leaves and stir them in at the very end. Serve hot over steamed jasmine rice.</textarea>
<div class="flex justify-end mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="p-2 text-on-surface-variant hover:text-error"><span class="material-symbols-outlined text-lg">delete</span></button>
</div>
</div>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Actions Mobile Sticky -->
<footer class="fixed bottom-0 left-0 right-0 p-6 glass-effect md:hidden z-40">
<div class="flex gap-4">
<button class="flex-1 py-4 px-6 rounded-full border-2 border-primary text-primary font-bold hover:bg-primary-container/10 transition-colors">
                Cancel
            </button>
<button class="flex-[2] py-4 px-6 rounded-full bg-primary text-on-primary font-bold shadow-lg shadow-primary/30 active:scale-95 transition-all">
                Save Changes
            </button>
</div>
</footer>
</body></html>
